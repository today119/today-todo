<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘 꼭! 할 일</title>
<meta name="theme-color" content="#ffe8a3">
<link rel="manifest" href="manifest.json?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png?v=4">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#4d3b33;--sub:#a08c80;--pink:#ff8fab;--red:#ff5d73;--yel:#ffe48a;--grn:#6cc78c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Gaegu',system-ui,-apple-system,sans-serif;font-weight:700;font-size:21px;min-height:100vh;
  background-image:radial-gradient(#f3dcc6 1.3px,transparent 1.4px);background-size:22px 22px;padding-bottom:40px;overflow-x:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit;font-weight:inherit}
button{cursor:pointer;border:0;background:none}
.gf{font-family:'Gamja Flower',sans-serif;font-weight:400}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}
/* header */
.top{display:flex;align-items:center;gap:6px;padding:14px 0 4px}
.date{flex:1}
.date .d{font-family:'Gamja Flower';font-size:36px;line-height:1.05}
.date .d small{font-size:24px;color:#e2708f;margin-left:4px}
.date .hi{font-size:18px;color:var(--sub)}
.ib{height:44px;min-width:44px;padding:0 9px;border-radius:15px;background:#fff;box-shadow:0 2px 6px #e9cdb655;font-size:21px}
.ib.cloud{font-size:16px}
.ib.cloud.off{background:#ffe1e5}
/* plant card */
.hero{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:14px 16px;margin:10px 0 18px;box-shadow:0 4px 14px #ebcfb855;position:relative}
.pot{width:92px;height:92px;flex:none;display:grid;place-items:center;font-size:66px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#fff3d1,#ffe4ef);position:relative}
.pot.grow{animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{0%{transform:scale(.6)}100%{transform:scale(1)}}
.pot .spk{position:absolute;font-size:20px;animation:twk 1.6s infinite}
@keyframes twk{50%{opacity:.2;transform:scale(.6)}}
.hero .tx{flex:1;min-width:0}
.hero .msg{font-family:'Gamja Flower';font-size:25px;line-height:1.2}
.bar{height:20px;border-radius:99px;background:#f6ece3;margin:8px 0 4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(-45deg,#ff9db3 0 10px,#ffb8c8 10px 20px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.bar.full i{background:repeating-linear-gradient(-45deg,#7fd68f 0 10px,#a6e5ae 10px 20px)}
.cnt{font-size:18px;color:var(--sub)}
.cnt b{color:#e2587d;font-size:22px}
/* memo paper */
.paper{position:relative;background:#fffdf6;border-radius:6px 6px 26px 6px;padding:30px 14px 16px;box-shadow:0 8px 22px #e3c3a344, inset 0 -5px 0 #f5ecd8;
  background-image:repeating-linear-gradient(transparent 0 47px,#f1e2cf 47px 48px);background-position:0 20px}
.paper::before{content:'';position:absolute;top:-13px;left:50%;width:130px;height:28px;margin-left:-65px;transform:rotate(-2deg);border-radius:3px;
  background:repeating-linear-gradient(90deg,#ffc2d1cc 0 12px,#ffd8e2cc 12px 24px)}
.paper h2{font-family:'Gamja Flower';font-weight:400;font-size:28px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.paper h2 .n{font-size:18px;color:var(--sub);margin-left:auto;font-family:'Gaegu'}
.add{display:flex;gap:6px;align-items:center;background:#fff;border:2.5px dashed #f2c3cf;border-radius:18px;padding:5px 5px 5px 12px;margin-bottom:6px}
.add input{flex:1;min-width:0;border:0;outline:none;background:none;padding:8px 0;font-size:21px}
.add input::placeholder{color:#c9b6aa}
.tg{height:40px;padding:0 9px;border-radius:12px;background:#f8f0ea;font-size:16px;white-space:nowrap;color:#a08c80}
.tg.on{background:#fff0b3;color:#c48a00}
.tg.on.rp{background:#e0f2ff;color:#3f88c9}
.addb{height:42px;padding:0 15px;border-radius:14px;background:linear-gradient(135deg,#ff9db3,#ff7898);color:#fff;font-size:20px;box-shadow:0 3px 8px #ff8fab66}
.carry{width:100%;margin:4px 0 6px;padding:10px;border-radius:14px;background:#fff4d6;color:#b07d00;font-size:21px;border:2px dashed #f5d27a}
ul{list-style:none;margin:0;padding:0}
li{position:relative;display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 2px;transition:opacity .3s}
li .ck{width:36px;height:36px;flex:none;border-radius:50%;border:3px solid #f0b5c3;background:#fff;display:grid;place-items:center;font-size:20px;transition:.2s}
li.star .ck{border-color:#ffb02e}
li .ck:active{transform:scale(.85)}
li .ic{font-size:26px;flex:none;width:32px;text-align:center}
li .t{flex:1;min-width:0;position:relative;word-break:keep-all;overflow-wrap:anywhere;line-height:1.25;padding:4px 0;font-size:22px}
li .t .st{color:#ff4d6d;font-size:17px;margin-right:2px;vertical-align:2px}
li .t .rp{font-size:13px;color:#3f88c9;background:#e6f4ff;border-radius:99px;padding:0 6px;margin-left:4px;vertical-align:3px}
li .more{width:42px;height:42px;border-radius:14px;background:#fff6f8;flex:none;display:grid;place-items:center;padding:0}
li .more .er{width:36px;height:36px}
li.done .more{opacity:.6}
li .t svg{position:absolute;left:-4px;top:50%;width:calc(100% + 8px);height:22px;margin-top:-11px;overflow:visible;pointer-events:none}
li .t svg path{fill:none;stroke:#ff7b98;stroke-width:4.5;stroke-linecap:round;opacity:.85}
li.done .t{color:#b9a69a}
li.done .ck{background:#ff8fab;border-color:#ff8fab;color:#fff}
li.done .ic{filter:grayscale(.6);opacity:.6}
li .stamp{position:absolute;right:50px;top:50%;margin-top:-25px;width:50px;height:50px;border-radius:50%;border:3px solid #ff4d6d;color:#ff4d6d;font-family:"Gamja Flower";font-size:16px;line-height:1;display:grid;place-items:center;text-align:center;transform:rotate(-14deg);opacity:.85;background:#fff5f7cc;pointer-events:none}
li .stamp.new{animation:stamp .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:rotate(-40deg) scale(2.6);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.85}}
.draw path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sep{text-align:center;color:var(--sub);font-size:17px;margin:12px 0 2px}
.empty{text-align:center;color:var(--sub);padding:22px 0 10px;font-size:20px}
.empty .big{font-size:50px;display:block}
/* praise popup */
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:'Gamja Flower';font-size:44px;color:#ff5d84;text-shadow:0 3px 0 #fff,0 0 18px #fff;pointer-events:none;z-index:70;white-space:nowrap;animation:pr 1.2s ease-out forwards}
@keyframes pr{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* clear overlay */
.clear{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:#fff8ecdd;backdrop-filter:blur(3px);flex-direction:column;text-align:center;padding:20px}
.clear.on{display:flex}
.clear .fl{font-size:130px;animation:bloom 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes bloom{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.clear h1{font-family:'Gamja Flower';font-weight:400;font-size:50px;margin:6px 0;color:#ff5d84;animation:wig 1.2s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-3deg) scale(1.04)}}
.clear p{font-size:23px;margin:4px 0 18px;color:#8a7266}
.clear button{padding:14px 30px;border-radius:99px;background:linear-gradient(135deg,#ff9db3,#ff7898);color:#fff;font-size:24px;box-shadow:0 4px 12px #ff8fab66}
/* calendar */
.cal{background:#fff;border-radius:26px;padding:14px;box-shadow:0 4px 14px #ebcfb855;margin-top:18px}
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-family:'Gamja Flower';font-weight:400;font-size:27px}
.calh button{width:40px;height:40px;border-radius:12px;background:#fff1ea;font-size:18px}
.stat{display:flex;gap:8px;margin:10px 0}
.stat div{flex:1;background:#fff6f8;border-radius:16px;padding:8px;text-align:center;font-size:16px;color:var(--sub)}
.stat b{display:block;font-size:28px;color:#ff5d84;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:16px;color:var(--sub)}
.dow:first-child{color:#ff6b81}.dow:last-child{color:#5b9bf0}
.dc{aspect-ratio:1/1.05;border-radius:14px;background:#fffaf4;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;font-size:15px;position:relative}
.dc.out{visibility:hidden}
.dc.td{box-shadow:0 0 0 2.5px #ff8fab inset}
.dc .s{font-size:27px;line-height:1.05}
.dc .p{font-size:13px;color:var(--sub)}
.dc.sel{background:#ffe8ef}
.dayv{margin-top:10px;background:#fffaf4;border-radius:16px;padding:10px 12px;font-size:19px}
.dayv div{padding:2px 0}
/* sheet */
.ov{position:fixed;inset:0;background:#4d3b3366;display:none;align-items:flex-end;justify-content:center;z-index:95}
.ov.on{display:flex}
.sheet{background:#fffdf8;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:'Gamja Flower';font-weight:400;font-size:27px;margin:0 0 10px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;width:40px;height:40px;border-radius:12px;background:#f6eee8;font-size:19px}
.lbl{font-size:17px;color:#9a7a6c;margin:14px 0 6px}
.inp{width:100%;padding:11px 12px;border-radius:14px;border:2.5px solid #f0e2d6;background:#fff;outline:none;font-size:20px}
.inp:focus{border-color:var(--pink)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.icons button{font-size:25px;height:46px;border-radius:12px;background:#f8f1ec;border:2px solid transparent}
.icons button.on{border-color:var(--pink);background:#ffe3ea}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns button{flex:1;min-width:120px;padding:12px;border-radius:14px;background:#f6eee8;font-size:19px}
.btns .pri{background:linear-gradient(135deg,#ff9db3,#ff7898);color:#fff}
.btns .del{background:#fff0f1;color:#d84a5b}
.rl{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:20px}
.rl span{flex:1}
.rl button{padding:6px 10px;border-radius:10px;background:#f6eee8;font-size:16px}
.share{background:#eef6ff;border-radius:16px;padding:12px;font-size:18px;line-height:1.45}
.share b.code{background:#fff;border-radius:8px;padding:1px 8px;letter-spacing:1px}
.note{font-size:15px;color:var(--sub)}
.sw{display:flex;align-items:center;gap:8px;font-size:19px;margin-top:8px}
.sw input{width:22px;height:22px;accent-color:#ff8fab}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#4d3b33;color:#fff;padding:11px 20px;border-radius:99px;z-index:99;transition:.3s;white-space:nowrap;font-size:19px}
.toast.on{transform:translateX(-50%) translateY(0)}
/* coupon */
.cpa{display:flex;align-items:center;gap:8px;width:100%;margin:4px 0 8px;padding:10px 12px;border-radius:16px;background:#fff0f3;border:2.5px solid #ff8fab;color:#d94b72;font-size:20px;text-align:left;animation:wig 2.4s ease-in-out infinite}
.cpa b{background:#ff5d84;color:#fff;border-radius:99px;padding:0 9px;font-size:17px}
@keyframes wig{0%,88%,100%{transform:none}92%{transform:rotate(-1.2deg)}96%{transform:rotate(1.2deg)}}
.ib .bd{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:#ff5d84;color:#fff;font-size:13px;display:grid;place-items:center;padding:0 4px}
.ib{position:relative}
.cpn{background:#fff;border-radius:26px;padding:14px;box-shadow:0 4px 14px #ebcfb855;margin-top:18px}
.cpn h2{font-family:'Gamja Flower';font-weight:400;font-size:30px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.cpn h2 .addc{margin-left:auto;font-family:'Gaegu';font-weight:700;font-size:19px;padding:7px 14px;border-radius:99px;background:linear-gradient(135deg,#ff9db3,#ff7898);color:#fff}
.cc{display:flex;align-items:center;gap:10px;width:100%;padding:9px;margin:7px 0;border-radius:18px;background:#fffaf4;border:2px dashed #f0dcc8;text-align:left;position:relative}
.cc .th{width:58px;height:58px;border-radius:12px;flex:none;background:#f6eee8 center/cover;display:grid;place-items:center;font-size:30px}
.cc .ci{flex:1;min-width:0}
.cc .cn{font-size:21px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .cs{font-size:16px;color:var(--sub)}
.dday{flex:none;font-size:18px;padding:3px 10px;border-radius:99px;background:#e9f7ee;color:#3a9a5c}
.dday.d7{background:#fff4d6;color:#c08400}.dday.d3{background:#ffe3ea;color:#e0456c}.dday.d0{background:#ff5d84;color:#fff}.dday.ex{background:#eee;color:#999}
.cc.d3,.cc.d0{border-color:#ff9db3;background:#fff4f6}
.cc.used,.cc.exp{opacity:.55}
.cc .us{position:absolute;right:62px;top:50%;transform:translateY(-50%) rotate(-14deg);border:3px solid #ff5d84;color:#ff5d84;border-radius:10px;padding:0 6px;font-size:17px;background:#fff8}
.cpn details summary{font-size:18px;color:var(--sub);margin-top:8px}
.ph{display:block;width:100%;min-height:120px;border-radius:16px;border:2.5px dashed #f0d2c2;background:#fffaf4 center/contain no-repeat;color:var(--sub);font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:5px 11px;border-radius:99px;background:#f6eee8;font-size:17px}
.vw{position:fixed;inset:0;z-index:90;background:#fff;display:none;flex-direction:column;align-items:center;padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.vw.on{display:flex}
.vw .vh{width:100%;max-width:560px;display:flex;align-items:center;gap:8px}
.vw .vh b{flex:1;font-family:'Gamja Flower';font-weight:400;font-size:28px;line-height:1.1}
.vw img{width:100%;max-width:560px;margin:10px 0;border-radius:12px;box-shadow:0 2px 10px #0002}
.vw .noimg{margin:30px 0;font-size:70px}
.vw .vi{width:100%;max-width:560px;font-size:20px;line-height:1.5}
.vw .btns{width:100%;max-width:560px}
.hide{display:none!important}
.ptabs{display:flex;gap:6px;margin:0 0 10px}
.ptabs button{flex:1;padding:9px 0;border-radius:14px;background:#f7efe8;font-size:19px;color:#a08c80}
.ptabs button i{font-style:normal;display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:#ff8fab;color:#fff;font-size:15px;padding:0 5px;vertical-align:1px}
.ptabs button.on{background:#ffe3ea;color:#d94b72;box-shadow:inset 0 0 0 2px #ffb3c4}
.ptabs button.on.v-home{background:#fff1d6;color:#c47a00;box-shadow:inset 0 0 0 2px #ffd27a}
.ptabs button.on.v-work{background:#e3f1ff;color:#2f7cc4;box-shadow:inset 0 0 0 2px #9fcdf5}
.tg.pl.p-home{background:#fff1d6;color:#c47a00}
.tg.pl.p-work{background:#e3f1ff;color:#2f7cc4}
.plh{font-family:'Gamja Flower';font-size:24px;margin:10px 0 2px;padding:3px 12px;border-radius:12px;display:flex;align-items:center}
.plh span{margin-left:auto;font-family:'Gaegu';font-size:16px;color:var(--sub)}
.plh.p-home{background:#fff3dc;color:#b06e00}
.plh.p-work{background:#e6f3ff;color:#2a6fb0}
.pc{display:inline-block;background:#f7efe8;border-radius:99px;padding:0 8px;margin-left:4px;font-size:16px}
@media(max-width:430px){.tg{padding:0 6px;font-size:14px;height:38px}.add{gap:4px;padding-left:9px}.addb{padding:0 12px}}
.date .d{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;white-space:nowrap}
.date{min-width:0}
.nv{height:36px;min-width:36px;border-radius:11px;background:#fff;box-shadow:0 2px 5px #e9cdb655;font-size:17px;color:#c9879a;padding:0 8px}
.nv.tdb{font-size:16px;color:#d94b72;background:#ffe3ea;height:30px}
.vd{font-size:18px;padding:1px 10px;border-radius:99px}
.vd.f{background:#e6f3ff;color:#2a6fb0}.vd.p{background:#f3ece6;color:#8a7266}
body.other .paper{background-color:#f9fcff}
body.other .paper::before{background:repeating-linear-gradient(90deg,#b9dcffcc 0 12px,#d6ebffcc 12px 24px)}
.upc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px;font-size:18px;color:#2a6fb0;background:#eef6ff;border-radius:14px;padding:8px 10px}
.upc button{background:#fff;border-radius:99px;padding:3px 10px;font-size:17px;color:#2a6fb0;box-shadow:0 1px 3px #0001}
.upc button b{color:#ff5d84}
@media(max-width:430px){.date .d{font-size:30px}.nv{min-width:30px;height:30px;padding:0 6px}}
.date .d small.wd{font-size:24px;margin-left:3px}
.date .d{font-size:clamp(26px,8vw,36px)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <div class="date"><div class="d" id="dTitle"></div><div class="hi" id="hi"></div></div>
    <button class="ib cloud" id="cloud" title="온라인 저장">☁️</button>
    <button class="ib" id="cpBtn" title="쿠폰함">🎟️</button>
    <button class="ib" id="calBtn" title="달력">📅</button>
    <button class="ib" id="setBtn" title="설정">⚙️</button>
  </div>
  <div class="hero">
    <div class="pot" id="pot">🌱</div>
    <div class="tx"><div class="msg" id="msg"></div><div class="bar" id="bar"><i></i></div><div class="cnt" id="cnt"></div></div>
  </div>
  <div class="paper">
    <h2>📝 오늘 꼭! 할 일 <span class="n" id="n"></span></h2>
    <div class="ptabs" id="ptabs"></div>
    <form class="add" id="addF" autocomplete="off">
      <button type="button" class="tg pl" id="plT"></button>
      <input id="addI" placeholder="할 일을 써요 ✏️" maxlength="60" enterkeyhint="done">
      <button type="button" class="tg" id="starT" title="꼭!">⭐꼭</button>
      <button type="button" class="tg rp" id="rpT" title="매일">🔁매일</button>
      <button class="addb">+</button>
    </form>
    <button class="cpa hide" id="cpa"></button>
    <button class="carry hide" id="carry"></button>
    <div class="upc hide" id="upc"></div>
    <ul id="list"></ul>
  </div>
  <div class="cal hide" id="cal"></div>
  <div class="cpn hide" id="cpn"></div>
</div>
<div class="clear" id="clear"><div class="fl">🌸</div><h1>오늘 미션 클리어!</h1><p id="clearP"></p><button id="clearB">고마워 🥰</button></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="vw" id="vw"></div>
<div class="toast" id="toast"></div>
<input type="file" id="cfile" accept="image/*" class="hide">

<script>
const KEY='today_todo_v1';

  if(k==='pop'){tone(520,0,.12,'sine',.22,1040);tone(1320,.08,.18,'triangle',.12)}
  else if(k==='add'){tone(660,0,.08,'triangle',.1)}
  else if(k==='fan'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.35,'triangle',.16));tone(1319,.55,.7,'triangle',.14);tone(1047,.55,.7,'sine',.12)}
}catch(e){}}

function burst(x,y,n,big){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(big?7:4)+Math.random()*(big?9:5);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?4:2),r:3+Math.random()*4,c:rnd(PCOL),s:Math.random()<.35?'♥':Math.random()<.5?'★':'',life:1,rot:Math.random()*6})}
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){const D=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.985;p.life-=.012;p.rot+=.1;cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;
    if(p.s){cx.font=`${p.r*4*D}px sans-serif`;cx.fillText(p.s,p.x*D,p.y*D)}else{cx.save();cx.translate(p.x*D,p.y*D);cx.rotate(p.rot);cx.fillRect(-p.r*D,-p.r*D/2,p.r*2*D,p.r*D);cx.restore()}});
  cx.globalAlpha=1;raf=parts.length?requestAnimationFrame(tick):null}
function streak(){let n=0;const d=new Date();const isClear=k=>{const L=S.days[k];return L&&L.length&&L.every(x=>x.done)};
  if(!isClear(ds(d)))d.setDate(d.getDate()-1);
  while(isClear(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
function celebrate(){const s=streak();snd('fan');
  $('#clearP').innerHTML=`할 일 ${dayList(today()).length}개를 모두 해냈어요!<br>${s>1?`🔥 ${s}일 연속 클리어!`:'달력에 꽃 스티커 🌸 붙였어요'}`;
  $('#clear').classList.add('on');
  let k=0;const iv=setInterval(()=>{burst(Math.random()*innerWidth,innerHeight*.25+Math.random()*innerHeight*.3,40,true);if(++k>5)clearInterval(iv)},280);}

function renderCal(){const n=new Date();if(!calYM)calYM=[n.getFullYear(),n.getMonth()];const[y,m]=calYM;
  const first=new Date(y,m,1),last=new Date(y,m+1,0).getDate(),t=today();

  $('#cal').innerHTML=`<div class="calh"><button id="cp">◀</button><b>${y}년 ${m+1}월 꽃 스티커</b><button id="cn">▶</button></div>

  $('#cp').onclick=()=>{calYM=m?[y,m-1]:[y-1,11];renderCal()};$('#cn').onclick=()=>{calYM=m<11?[y,m+1]:[y+1,0];renderCal()};

  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};im.onerror=()=>no();im.src=u})}

   <div class="btns"><button class="pri" id="shr">🔗 내 링크 보내기·복사</button></div>
   <details style="margin-top:8px"><summary class="note">다른 코드로 바꾸기</summary><div style="display:flex;gap:6px;margin-top:6px"><input class="inp" id="cin" placeholder="코드" maxlength="16"><button class="tg on" id="cgo" style="height:auto">불러오기</button></div></details></div>`);
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{const id=b.dataset.rd;S.routines=S.routines.filter(r=>r.id!==id);S.days[today()]=dayList(today()).filter(x=>!(x.r===id&&!x.done));render();draw()});
  $('#snd').onchange=e=>{S.sound=e.target.checked;save()};
  $('#shr').onclick=shareLink;
    $('#rld').onclick=hardReload;
  const ex=$('#ext');if(ex)ex.onclick=()=>{const u=shareURL();location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u)};
  $('#cgo').onclick=()=>{const v=$('#cin').value.trim().toLowerCase();if(!/^[a-z0-9]{10,16}$/.test(v)){toast('코드를 확인해 주세요');return}S.code=v;history.replaceState(null,'',shareURL());pull('hard').then(r=>{toast(r==='got'?'☁️ 불러왔어요!':'이 코드엔 메모가 없어서 지금 메모를 올렸어요');closeSheet()})};
};draw()}
$('#setBtn').onclick=openSet;$('#cloud').onclick=openSet;

/* ---------- 온라인 저장 ---------- */
const newCode=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let r='';crypto.getRandomValues(new Uint8Array(12)).forEach(v=>r+=c[v%c.length]);return r};
const shareURL=()=>location.origin+location.pathname+'#f='+S.code;
let pushT=null,syncState='',pulling=false,initAt=0;
function setCloud(st){syncState=st;const b=$('#cloud');b.textContent={ok:'☁️✓',busy:'☁️…',off:'☁️⚠️'}[st]||'☁️';b.className='ib cloud '+st}
function queuePush(){if(!S.code)return;clearTimeout(pushT);setCloud('busy');pushT=setTimeout(push,700)}
async function push(){try{const r=await fetch(DB+S.code+'.json',{method:'PUT',body:JSON.stringify({at:S.at,d:S.lastD})});if(!r.ok)throw 0;setCloud('ok')}catch(e){setCloud('off')}}
async function pull(force){if(!S.code||pulling)return;pulling=true;
  try{const r=await fetch(DB+S.code+'.json?x='+Date.now());if(!r.ok)throw 0;const j=await r.json();
    if(force===true&&(S.at||0)>initAt)force=false;
    if(j&&j.d&&(force||j.at>(S.at||0))){const d=JSON.parse(j.d);S.days=d.days||{};S.routines=d.routines||[];S.coupons=d.coupons||[];S.lastD=j.d;S.at=j.at;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!$('#ov').classList.contains('on')&&!$('#vw').classList.contains('on'))render();setCloud('ok');return 'got'}
    if(!j||!j.d||j.at<(S.at||0)){await push();return 'pushed'}
    setCloud('ok')}catch(e){setCloud('off')}finally{pulling=false}}
async function shareLink(){const u=shareURL();
  if(navigator.share){try{await navigator.share({title:'📝 오늘 꼭! 할 일',url:u});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(u);toast('🔗 링크 복사했어요!')}catch(e){prompt('이 링크를 복사하세요',u)}}
function initSync(){const m=location.hash.match(/f=([a-z0-9]{10,16})/);let force=false;
  if(m&&m[1]!==S.code){S.code=m[1];force=true}
  const lost=!S.code&&!m&&matchMedia('(display-mode: standalone)').matches;
  if(!S.code)S.code=newCode();
  if(lost)setTimeout(()=>{openSet();toast('메모가 안 보이면 「다른 코드로 바꾸기」에 내 코드를 넣어요')},800);
  history.replaceState(null,'',shareURL());initAt=S.at||0;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  pull(force).then(r=>{if(force&&r==='got')toast('☁️ 내 메모를 불러왔어요!')});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();if(curDay!==today())render()}});
  addEventListener('focus',()=>pull());
  setInterval(()=>{if(!document.hidden){pull();if(curDay!==today())render()}},30000);
}

/* ---------- 새 버전 자동 반영 ---------- */
const APPVER='20261017c';
let verBusy=false;
async function checkVer(auto){if(verBusy)return;verBusy=true;try{const r=await fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const APPVER='([^']+)'/);
  if(m&&m[1]!==APPVER){if(auto&&($('#ov').classList.contains('on')||document.activeElement?.tagName==='INPUT'))return;await new Promise(r=>setTimeout(r,900));location.reload();return true}}catch(e){}finally{verBusy=false}return false}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVer(true)});
setInterval(()=>{if(!document.hidden)checkVer(true)},300000);
function hardReload(){toast('🔄 새로 불러오는 중…');setTimeout(()=>location.reload(),500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeView();$('#clear').classList.remove('on')}});
render();
initSync();
</script>
